<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360° VR Video Görüntüleyici</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080808;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }
    #header h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.08em; opacity: 0.85; }
    #vrBadge { font-size: 11px; letter-spacing: 0.12em; border: 1px solid rgba(255,255,255,0.25); padding: 4px 12px; border-radius: 20px; opacity: 0.7; }

    canvas {
      position: absolute; inset: 0;
      width: 100% !important; height: 100% !important;
      cursor: grab; touch-action: none;
    }
    canvas:active { cursor: grabbing; }

    #loadingScreen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 5;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.7);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText { font-size: 14px; color: rgba(255,255,255,0.5); }
    #errorBox {
      display: none; flex-direction: column; align-items: center; gap: 12px;
      background: rgba(255,60,60,0.12); border: 1px solid rgba(255,60,60,0.25);
      padding: 20px 32px; border-radius: 12px; text-align: center;
    }
    #errorBox p { font-size: 13px; color: rgba(255,200,200,0.8); line-height: 1.6; }
    #fallbackLabel {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 13px;
    }
    #fallbackLabel:hover { background: rgba(255,255,255,0.18); }

    #progressWrap {
      position: absolute; bottom: 62px; left: 24px; right: 24px;
      z-index: 10; display: none; align-items: center; gap: 10px;
    }
    #progressBar {
      flex: 1; height: 3px; background: rgba(255,255,255,0.15);
      border-radius: 2px; cursor: pointer;
    }
    #progressFill { height: 100%; background: #fff; border-radius: 2px; width: 0%; }
    #timeDisplay { font-size: 12px; color: rgba(255,255,255,0.4); min-width: 90px; text-align: right; }

    #controls {
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 10; padding: 18px 24px;
      display: none; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22);
      color: #fff; padding: 8px 20px; border-radius: 24px; cursor: pointer; font-size: 13px;
      transition: background 0.2s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.22); }
    #hint { font-size: 12px; color: rgba(255,255,255,0.3); pointer-events: none; }
  </style>
</head>
<body>

  <div id="header">
    <h1>Edirne Sağlık Müzesi — 360° VR Tur</h1>
    <span id="vrBadge">360° · VR</span>
  </div>

  <canvas id="vrCanvas"></canvas>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <div id="loadingText">Video yükleniyor...</div>
    <div id="errorBox">
      <p>Video otomatik yüklenemedi.<br>Dosyayı manuel olarak seçebilirsiniz.</p>
      <label id="fallbackLabel">
        Dosya Seç
        <input type="file" id="fileInput" accept="video/*" style="display:none;">
      </label>
    </div>
  </div>

  <div id="progressWrap">
    <div id="progressBar"><div id="progressFill"></div></div>
    <span id="timeDisplay">0:00 / 0:00</span>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="playBtn">⏸ Durdur</button>
    <button class="ctrl-btn" id="muteBtn">🔊 Ses</button>
    <button class="ctrl-btn" id="resetBtn">⟳ Sıfırla</button>
    <span id="hint">Sürükle = döndür · Scroll = zoom</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    /* ── Video URL ── Buraya kendi video adresinizi yazın ── */
    const VIDEO_URL = 'https://raw.githubusercontent.com/edirnesaglikmuzesi-bit/muze/main/vr.mp4';

    const canvas = document.getElementById('vrCanvas');
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingText = document.getElementById('loadingText');
    const errorBox = document.getElementById('errorBox');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const controls = document.getElementById('controls');
    const playBtn = document.getElementById('playBtn');
    const muteBtn = document.getElementById('muteBtn');
    const resetBtn = document.getElementById('resetBtn');
    const progressBar = document.getElementById('progressBar');
    const fileInput = document.getElementById('fileInput');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
    const scene = new THREE.Scene();

    function resize() {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener('resize', resize);

    let video, texture, sphere, isReady = false, isPlaying = false;

    function formatTime(s) {
      s = Math.floor(s);
      return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
    }

    function setupSphere(vid) {
      texture = new THREE.VideoTexture(vid);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.format = THREE.RGBFormat;
      if (sphere) scene.remove(sphere);
      const geo = new THREE.SphereGeometry(500, 64, 48);
      geo.scale(-1, 1, 1);
      sphere = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: texture }));
      scene.add(sphere);
    }

    function onVideoReady() {
      isReady = true; isPlaying = true;
      loadingScreen.style.display = 'none';
      controls.style.display = 'flex';
      progressWrap.style.display = 'flex';
      playBtn.textContent = '⏸ Durdur';
    }

    function showError() {
      loadingText.textContent = 'Video yüklenemedi.';
      errorBox.style.display = 'flex';
    }

    function loadVideoUrl(url) {
      video = document.createElement('video');
      video.crossOrigin = 'anonymous';
      video.src = url;
      video.loop = true;
      video.muted = true;
      video.playsInline = true;

      video.addEventListener('timeupdate', () => {
        if (!video.duration) return;
        progressFill.style.width = (video.currentTime / video.duration * 100) + '%';
        timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
      });

      video.addEventListener('error', showError);

      const timeout = setTimeout(() => { if (!isReady) showError(); }, 15000);

      setupSphere(video);

      video.play().then(() => {
        clearTimeout(timeout);
        onVideoReady();
        muteBtn.textContent = '🔇 Sessiz';
        document.addEventListener('click', () => {
          video.muted = false;
          muteBtn.textContent = '🔊 Ses';
        }, { once: true });
      }).catch(() => {
        clearTimeout(timeout);
        showError();
      });
    }

    function loadVideoFile(file) {
      if (video) { video.pause(); }
      video = document.createElement('video');
      video.src = URL.createObjectURL(file);
      video.loop = true; video.muted = false; video.playsInline = true;
      video.addEventListener('timeupdate', () => {
        if (!video.duration) return;
        progressFill.style.width = (video.currentTime / video.duration * 100) + '%';
        timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
      });
      setupSphere(video);
      video.play().then(() => { onVideoReady(); muteBtn.textContent = '🔊 Ses'; });
    }

    fileInput.addEventListener('change', e => { if (e.target.files[0]) loadVideoFile(e.target.files[0]); });

    loadVideoUrl(VIDEO_URL);

    // Rotation
    let isDragging = false, prevX = 0, prevY = 0;
    let lon = 0, lat = 0, targetLon = 0, targetLat = 0;

    canvas.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      targetLon -= (e.clientX - prevX) * 0.25;
      targetLat += (e.clientY - prevY) * 0.12;
      targetLat = Math.max(-85, Math.min(85, targetLat));
      prevX = e.clientX; prevY = e.clientY;
    });
    canvas.addEventListener('touchstart', e => { prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; }, { passive: true });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      targetLon -= (e.touches[0].clientX - prevX) * 0.25;
      targetLat += (e.touches[0].clientY - prevY) * 0.12;
      targetLat = Math.max(-85, Math.min(85, targetLat));
      prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
    }, { passive: false });
    window.addEventListener('wheel', e => {
      camera.fov = Math.max(40, Math.min(100, camera.fov + e.deltaY * 0.05));
      camera.updateProjectionMatrix();
    });

    progressBar.addEventListener('click', e => {
      if (!video || !video.duration) return;
      const rect = progressBar.getBoundingClientRect();
      video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
    });

    playBtn.addEventListener('click', () => {
      if (!video) return;
      if (isPlaying) { video.pause(); isPlaying = false; playBtn.textContent = '▶ Oynat'; }
      else { video.play(); isPlaying = true; playBtn.textContent = '⏸ Durdur'; }
    });
    muteBtn.addEventListener('click', () => {
      if (!video) return;
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? '🔇 Sessiz' : '🔊 Ses';
    });
    resetBtn.addEventListener('click', () => {
      targetLon = 0; targetLat = 0;
      camera.fov = 75; camera.updateProjectionMatrix();
    });

    function animate() {
      requestAnimationFrame(animate);
      lon += (targetLon - lon) * 0.08;
      lat += (targetLat - lat) * 0.08;
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon);
      camera.lookAt(
        500 * Math.sin(phi) * Math.cos(theta),
        500 * Math.cos(phi),
        500 * Math.sin(phi) * Math.sin(theta)
      );
      if (isReady && texture) texture.needsUpdate = true;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

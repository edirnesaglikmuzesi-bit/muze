<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Külliye Rehberi — Canlı Konum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96e;
    --gold-dim: #8a6a1f;
    --ink: #1a1208;
    --parchment: #f5edd8;
    --parchment-dark: #e8d9b8;
    --teal: #1d5c5c;
    --teal-light: #2a8080;
    --crimson: #8b1a1a;
    --stone: #5a4a2a;
    --shadow: rgba(26,18,8,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Amiri', serif;
    background: var(--ink);
    color: var(--parchment);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  #header {
    background: linear-gradient(135deg, #0e0a04 0%, #1a1208 60%, #0d1a18 100%);
    border-bottom: 1px solid var(--gold-dim);
    padding: 10px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  #header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
  }
  .header-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--gold-light);
    text-transform: uppercase;
    line-height: 1.2;
  }
  .header-sub {
    font-size: 10px;
    color: var(--gold-dim);
    letter-spacing: 1px;
    font-family: 'Cinzel', serif;
  }
  #gps-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--gold-dim);
    border-radius: 20px;
    padding: 4px 10px;
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 1px;
    color: #888;
    transition: all 0.4s;
  }
  #gps-badge.active { border-color: var(--teal-light); color: #7dffcc; }
  #gps-badge.error { border-color: var(--crimson); color: #ff7d7d; }
  .gps-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #444;
    transition: all 0.4s;
  }
  #gps-badge.active .gps-dot {
    background: #7dffcc;
    box-shadow: 0 0 6px #7dffcc;
    animation: pulse-gps 1.5s infinite;
  }
  #gps-badge.error .gps-dot { background: #ff7d7d; }
  @keyframes pulse-gps {
    0%,100% { box-shadow: 0 0 4px #7dffcc; }
    50% { box-shadow: 0 0 12px #7dffcc, 0 0 20px rgba(125,255,204,0.3); }
  }

  /* ── MAP CONTAINER ── */
  #map-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0e0a04;
  }
  #map-canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* ── ZONE ANNOUNCEMENT ── */
  #zone-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(0deg, rgba(14,10,4,0.98) 0%, rgba(14,10,4,0.85) 80%, transparent 100%);
    padding: 20px 20px 28px;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
  }
  #zone-panel.visible { transform: translateY(0); }
  .zone-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .zone-name {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold-light);
    line-height: 1.1;
    margin-bottom: 6px;
  }
  .zone-announce {
    font-size: 14px;
    color: var(--parchment-dark);
    line-height: 1.5;
    font-style: italic;
  }
  .zone-color-bar {
    height: 3px;
    border-radius: 2px;
    margin-bottom: 10px;
    width: 40px;
  }

  /* ── NO ZONE ── */
  #no-zone {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(0deg, rgba(14,10,4,0.98) 0%, rgba(14,10,4,0.85) 80%, transparent 100%);
    padding: 18px 20px 26px;
    transition: opacity 0.4s;
    text-align: center;
  }
  .no-zone-text {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--stone);
    text-transform: uppercase;
  }

  /* ── ACCURACY BADGE ── */
  #acc-badge {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(14,10,4,0.8);
    border: 1px solid var(--gold-dim);
    border-radius: 12px;
    padding: 3px 9px;
    font-family: 'Cinzel', serif;
    font-size: 9px;
    color: var(--gold-dim);
    letter-spacing: 1px;
    display: none;
  }

  /* ── LOADING OVERLAY ── */
  #loading {
    position: absolute;
    inset: 0;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 50;
    transition: opacity 0.6s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .loader-ornament {
    width: 60px; height: 60px;
    border: 2px solid var(--gold-dim);
    border-top-color: var(--gold-light);
    border-radius: 50%;
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gold-dim);
    text-align: center;
    text-transform: uppercase;
  }

  /* ── PERMISSION OVERLAY ── */
  #permission-overlay {
    position: absolute;
    inset: 0;
    background: rgba(14,10,4,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 60;
    padding: 30px;
  }
  #permission-overlay.hidden { display: none; }
  .perm-icon { font-size: 48px; }
  .perm-title {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold-light);
    text-align: center;
    letter-spacing: 1px;
  }
  .perm-desc {
    font-size: 13px;
    color: var(--parchment-dark);
    text-align: center;
    line-height: 1.7;
    max-width: 280px;
  }
  .perm-btn {
    margin-top: 8px;
    background: linear-gradient(135deg, var(--gold-dim), var(--gold));
    color: var(--ink);
    border: none;
    border-radius: 4px;
    padding: 13px 32px;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .perm-btn:active { transform: scale(0.97); }

  /* ── ORNAMENTAL CORNER ── */
  .corner-ornament {
    position: absolute;
    width: 30px; height: 30px;
    pointer-events: none;
    opacity: 0.5;
  }
  .corner-ornament svg { width: 100%; height: 100%; }
  .co-tl { top: 8px; left: 8px; }
  .co-tr { top: 8px; right: 8px; transform: scaleX(-1); }
  .co-bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
  .co-br { bottom: 8px; right: 8px; transform: scale(-1); }

  /* ── COMPASS ── */
  #compass {
    position: absolute;
    top: 10px; left: 10px;
    width: 44px; height: 44px;
    background: rgba(14,10,4,0.85);
    border: 1px solid var(--gold-dim);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--gold-dim);
    pointer-events: none;
  }

  /* ── COORDS ── */
  #coords-display {
    position: absolute;
    top: 64px; left: 10px;
    background: rgba(14,10,4,0.8);
    border: 1px solid rgba(138,106,31,0.3);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 9px;
    color: var(--stone);
    line-height: 1.6;
    font-family: monospace;
    display: none;
    letter-spacing: 0.5px;
  }

  /* ── CENTER BUTTON ── */
  #center-btn {
    position: absolute;
    bottom: 130px; right: 14px;
    width: 44px; height: 44px;
    background: rgba(14,10,4,0.9);
    border: 1px solid var(--gold-dim);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, border-color 0.3s;
    z-index: 20;
  }
  #center-btn.active { opacity: 1; pointer-events: auto; border-color: var(--teal-light); }
  #center-btn:active { transform: scale(0.93); }

  /* ── ZOOM BUTTONS ── */
  #zoom-btns {
    position: absolute;
    bottom: 190px; right: 14px;
    display: flex; flex-direction: column; gap: 6px;
    z-index: 20;
  }
  .zoom-btn {
    width: 38px; height: 38px;
    background: rgba(14,10,4,0.85);
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    color: var(--gold-light);
    font-size: 20px; font-family: 'Cinzel', serif;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .zoom-btn:active { background: rgba(201,168,76,0.2); }
</style>
</head>

<!-- HEADER -->
<div id="header">
  <div>
    <div class="header-title">Külliye Rehberi</div>
    <div class="header-sub">Canlı Konum Sistemi</div>
  </div>
  <div id="gps-badge">

</div>

  <!-- ZOOM BUTTONS -->

  <!-- ZONE PANEL -->

  <!-- NO ZONE -->

  <!-- LOADING -->

function resizeCanvas() {
  const wrap = document.getElementById('map-wrap');
  W = canvas.width  = wrap.clientWidth  * (window.devicePixelRatio || 1);
  H = canvas.height = wrap.clientHeight * (window.devicePixelRatio || 1);
  canvas.style.width  = wrap.clientWidth  + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
  ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  fitToScreen();
}
window.addEventListener('resize', resizeCanvas);

// ═══════════════════════════════════════════════════════
// CONVERT: normalized → canvas pixel
// ═══════════════════════════════════════════════════════
// The floor plan fills a padded area in canvas
// ═══════════════════════════════════════════════════════
// VIEW TRANSFORM (pan + zoom)
// ═══════════════════════════════════════════════════════
const IW = 1600, IH = 1200; // world / image coordinate space
let view = { scale: 1, tx: 0, ty: 0 };
let minScale = 0.3, maxScale = 10, fitScale = 1;

function fitToScreen() {
  fitScale = Math.min(W / IW, H / IH);
  minScale = fitScale * 0.85;
  maxScale = fitScale * 9;
  view.scale = fitScale;
  view.tx = (W - IW * fitScale) / 2;
  view.ty = (H - IH * fitScale) / 2;
}

function clampView() {
  const margin = 80;
  const iw = IW * view.scale, ih = IH * view.scale;
  view.tx = Math.min(W - margin, Math.max(margin - iw, view.tx));
  view.ty = Math.min(H - margin, Math.max(margin - ih, view.ty));
}

function zoomAt(cx, cy, factor) {
  const newScale = Math.min(maxScale, Math.max(minScale, view.scale * factor));
  const f = newScale / view.scale;
  view.tx = cx - (cx - view.tx) * f;
  view.ty = cy - (cy - view.ty) * f;
  view.scale = newScale;
  clampView();
}

function normToScreen(nx, ny) {
  return { x: nx * IW * view.scale + view.tx, y: ny * IH * view.scale + view.ty };
}

// ── Smooth animation
let animTarget = null;
function animatePanTo(tx, ty) { animTarget = { tx, ty }; }
function stepAnimation() {
  if (!animTarget) return;
  const EASE = 0.13;
  view.tx += (animTarget.tx - view.tx) * EASE;
  view.ty += (animTarget.ty - view.ty) * EASE;
  if (Math.abs(animTarget.tx - view.tx) < 0.5 && Math.abs(animTarget.ty - view.ty) < 0.5) {
    view.tx = animTarget.tx; view.ty = animTarget.ty; animTarget = null;
  }
}

function centerOnUser() {
  if (!userPos) return;
  const wx = userPos.nx * IW * view.scale;
  const wy = userPos.ny * IH * view.scale;
  const iw = IW * view.scale, ih = IH * view.scale;
  const margin = 80;
  const rawTx = W / 2 - wx, rawTy = H / 2 - wy;
  const tx = Math.min(W - margin, Math.max(margin - iw, rawTx));
  const ty = Math.min(H - margin, Math.max(margin - ih, rawTy));
  animatePanTo(tx, ty);
  document.getElementById('center-btn').classList.remove('active');
}

// ── Center button
function showCenterBtn() {
  document.getElementById('center-btn').classList.add('active');
}

// ═══════════════════════════════════════════════════════
// TOUCH & MOUSE INPUT
// ═══════════════════════════════════════════════════════
let pointers = new Map();
let lastPinchDist = 0, lastPinchMid = null;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) pointers.set(t.identifier, { x: t.clientX, y: t.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    lastPinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    lastPinchMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
  animTarget = null;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const prev = new Map(pointers);
  for (const t of e.changedTouches) pointers.set(t.identifier, { x: t.clientX, y: t.clientY });
  if (pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    zoomAt(mid.x, mid.y, dist / (lastPinchDist || dist));
    if (lastPinchMid) { view.tx += mid.x - lastPinchMid.x; view.ty += mid.y - lastPinchMid.y; clampView(); }
    lastPinchDist = dist; lastPinchMid = mid;
  } else if (pointers.size === 1) {
    const [id] = pointers.keys();
    const cur = pointers.get(id), prv = prev.get(id);
    if (prv) { view.tx += cur.x - prv.x; view.ty += cur.y - prv.y; clampView(); }
    if (userPos) showCenterBtn();
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) pointers.delete(t.identifier);
  lastPinchMid = null;
}, { passive: false });

let mouseDown = false, lastMX = 0, lastMY = 0;
canvas.addEventListener('mousedown', e => { mouseDown = true; lastMX = e.clientX; lastMY = e.clientY; animTarget = null; });
window.addEventListener('mousemove', e => {
  if (!mouseDown) return;
  view.tx += e.clientX - lastMX; view.ty += e.clientY - lastMY;
  lastMX = e.clientX; lastMY = e.clientY;
  clampView();
  if (userPos) showCenterBtn();
});
window.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 0.88);
}, { passive: false });

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
let userPos = null;
let currentZoneId = null;
let animFrame = 0;

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function render() {
  stepAnimation();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0e0a04';
  ctx.fillRect(0, 0, W, H);

  // ── World space transform
  ctx.save();
  ctx.translate(view.tx, view.ty);
  ctx.scale(view.scale, view.scale);

  // PASS 1: polygon fills (below image)
  for (const z of ZONES) {
    const isActive = z.id === currentZoneId;
    ctx.beginPath();
    ctx.moveTo(z.pixelPointsNorm[0].x * IW, z.pixelPointsNorm[0].y * IH);
    for (let i = 1; i < z.pixelPointsNorm.length; i++)
      ctx.lineTo(z.pixelPointsNorm[i].x * IW, z.pixelPointsNorm[i].y * IH);
    ctx.closePath();
    const pulse = isActive ? 0.45 + 0.15 * Math.sin(animFrame * 0.06) : 0.28;
    ctx.fillStyle = hexToRgba(z.color, pulse);
    ctx.fill();
  }

  // Floor plan image
  if (imgLoaded) {
    ctx.globalAlpha = 0.72;
    ctx.drawImage(floorImg, 0, 0, IW, IH);
    ctx.globalAlpha = 1.0;
  }

  // PASS 2: polygon strokes (above image, scale-independent width)
  for (const z of ZONES) {
    const isActive = z.id === currentZoneId;
    ctx.beginPath();
    ctx.moveTo(z.pixelPointsNorm[0].x * IW, z.pixelPointsNorm[0].y * IH);
    for (let i = 1; i < z.pixelPointsNorm.length; i++)
      ctx.lineTo(z.pixelPointsNorm[i].x * IW, z.pixelPointsNorm[i].y * IH);
    ctx.closePath();
    ctx.strokeStyle = isActive ? z.color : hexToRgba(z.color, 0.8);
    ctx.lineWidth = (isActive ? 2.5 : 1.5) / view.scale;
    ctx.stroke();
  }

  // User position (world space, scale-independent sizes)
  if (userPos) {
    const wx = userPos.nx * IW, wy = userPos.ny * IH;
    const pulse = 0.5 + 0.5 * Math.sin(animFrame * 0.08);
    const S = 1 / view.scale;
    if (userPos.accuracyNorm) {
      ctx.beginPath();
      ctx.arc(wx, wy, userPos.accuracyNorm * IW * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(125,255,204,0.06)'; ctx.fill();
      ctx.strokeStyle = 'rgba(125,255,204,0.2)'; ctx.lineWidth = S; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(wx, wy, (14 + pulse * 4) * S, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(125,255,204,${0.07 * pulse})`; ctx.fill();
    ctx.beginPath(); ctx.arc(wx, wy, 9 * S, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(125,255,204,0.15)'; ctx.fill();
    ctx.strokeStyle = 'rgba(125,255,204,0.6)'; ctx.lineWidth = 1.5 * S; ctx.stroke();
    ctx.beginPath(); ctx.arc(wx, wy, 5 * S, 0, Math.PI * 2);
    ctx.fillStyle = '#7dffcc'; ctx.shadowColor = '#7dffcc'; ctx.shadowBlur = 10 * S;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(wx, wy - 15 * S); ctx.lineTo(wx - 5 * S, wy - 9 * S); ctx.lineTo(wx + 5 * S, wy - 9 * S);
    ctx.closePath(); ctx.fillStyle = 'rgba(125,255,204,0.7)'; ctx.fill();
  }

  ctx.restore(); // back to screen space

  // PASS 3: labels in screen space (fixed readable size regardless of zoom)
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const z of ZONES) {
    const isActive = z.id === currentZoneId;
    let sx = 0, sy = 0;
    for (const p of z.pixelPointsNorm) { sx += p.x; sy += p.y; }
    sx /= z.pixelPointsNorm.length; sy /= z.pixelPointsNorm.length;
    const screen = normToScreen(sx, sy);
    if (screen.x < -30 || screen.x > W + 30 || screen.y < -30 || screen.y > H + 30) continue;
    const fs = isActive ? 12 : 10;
    ctx.font = `${isActive ? '700' : '600'} ${fs}px 'Cinzel', serif`;
    ctx.strokeStyle = 'rgba(0,0,0,0.92)'; ctx.lineWidth = 3.5;
    ctx.strokeText(z.name, screen.x, screen.y);
    ctx.fillStyle = isActive ? z.color : '#ffffff';
    ctx.shadowColor = isActive ? z.color : 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = isActive ? 8 : 2;
    ctx.fillText(z.name, screen.x, screen.y);
    ctx.shadowBlur = 0;
  }

  animFrame++;
  requestAnimationFrame(render);
}

// ═══════════════════════════════════════════════════════
// ZONE UI UPDATE
// ═══════════════════════════════════════════════════════
let lastAnnouncedZoneId = null;

function updateZoneUI(zone) {
  const panel = document.getElementById('zone-panel');
  const noZone = document.getElementById('no-zone');

  if (zone) {
    document.getElementById('zone-name').textContent = zone.name;
    document.getElementById('zone-announce').textContent = zone.announce;
    document.getElementById('zone-color-bar').style.background = zone.color;
    panel.classList.add('visible');
    noZone.style.display = 'none';

    // Vibrate on new zone entry
    if (zone.id !== lastAnnouncedZoneId && navigator.vibrate) {
      navigator.vibrate([40, 20, 40]);
    }

    // Speech announce on new zone
    if (zone.id !== lastAnnouncedZoneId && 'speechSynthesis' in window) {
      const utt = new SpeechSynthesisUtterance(zone.announce);
      utt.lang = 'tr-TR';
      utt.rate = 0.95;
      window.speechSynthesis.cancel();
      setTimeout(() => window.speechSynthesis.speak(utt), 200);
    }

    lastAnnouncedZoneId = zone.id;
    currentZoneId = zone.id;
  } else {
    panel.classList.remove('visible');
    noZone.style.display = 'block';
    lastAnnouncedZoneId = null;
    currentZoneId = null;
  }
}

// ═══════════════════════════════════════════════════════
// GPS TRACKING
// ═══════════════════════════════════════════════════════
let watchId = null;

function startTracking() {
  document.getElementById('permission-overlay').classList.add('hidden');
  document.getElementById('loading').classList.remove('hidden');

  if (!navigator.geolocation) {
    showError('Tarayıcınız konum özelliğini desteklemiyor.');
    return;
  }

  watchId = navigator.geolocation.watchPosition(
    onPosition,
    onError,
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
  );
}

function onPosition(pos) {
  const { latitude: lat, longitude: lon, accuracy } = pos.coords;

  // Hide loading
  const loading = document.getElementById('loading');
  loading.classList.add('hidden');

  // Update GPS badge
  const badge = document.getElementById('gps-badge');
  badge.classList.add('active');
  badge.classList.remove('error');
  document.getElementById('gps-status-text').textContent = 'Canlı Konum';

  // Show accuracy
  const accBadge = document.getElementById('acc-badge');
  accBadge.style.display = 'block';
  document.getElementById('acc-val').textContent = Math.round(accuracy);

  // Update coords display
  document.getElementById('coords-display').style.display = 'block';
  document.getElementById('lat-val').textContent = lat.toFixed(7);
  document.getElementById('lon-val').textContent = lon.toFixed(7);

  // Convert GPS → normalized
  const norm = gpsToNorm(lat, lon);

  // Calculate accuracy in normalized units
  const earthRadius = 6371000;
  const latPerMeter = 1 / earthRadius * (180 / Math.PI);
  const lonPerMeter = 1 / (earthRadius * Math.cos(lat * Math.PI / 180)) * (180 / Math.PI);
  const georefLatSpan = Math.abs(GEOREF.bl.lat - GEOREF.tl.lat) + Math.abs(GEOREF.br.lat - GEOREF.tr.lat);
  const accuracyNorm = (accuracy * latPerMeter) / (georefLatSpan / 2 + 0.0001);


  // Detect zone
  const zone = detectZone(norm.x, norm.y);
  updateZoneUI(zone);

  // Auto-center on first fix
  if (!userPos || !userPos._centered) {
    userPos = { nx: norm.x, ny: norm.y, accuracyNorm: Math.min(accuracyNorm, 0.3), _centered: true };
    centerOnUser();
  } else {
    userPos = { nx: norm.x, ny: norm.y, accuracyNorm: Math.min(accuracyNorm, 0.3), _centered: true };
  }
  return;
}

function onError(err) {
  document.getElementById('loading').classList.add('hidden');
  const badge = document.getElementById('gps-badge');
  badge.classList.add('error');
  badge.classList.remove('active');

  let msg = 'GPS Hatası';
  if (err.code === 1) msg = 'İzin Reddedildi';
  else if (err.code === 2) msg = 'Konum Alınamadı';
  else if (err.code === 3) msg = 'Zaman Aşımı';
  document.getElementById('gps-status-text').textContent = msg;
}

function showError(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('gps-status-text').textContent = msg;
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
window.addEventListener('load', () => {
  resizeCanvas();
  render();

  // Check if geolocation available
  if (navigator.geolocation) {
    // Show loading briefly then check permission
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('permission-overlay').classList.remove('hidden');
    }, 800);
  } else {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('permission-overlay').classList.remove('hidden');
  }
});
</script>

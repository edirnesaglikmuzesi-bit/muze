<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Konum — Sultan II. Bayezid Külliyesi Sağlık Müzesi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e1c08">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --parchment:#f4e9d0; --parchment-deep:#e8d8b5;
    --ink:#2e1c08; --ink-soft:#4a3414;
    --gold:#b8860b; --gold-bright:#d4a017;
    --bronze:#8b5a2b; --bg-dark:#1a0f00;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Lora',Georgia,serif;
    background:var(--bg-dark);
    color:var(--ink);
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;overflow:hidden;
  }

  /* ── Üst başlık ── */
  header{
    flex:0 0 auto;
    background:linear-gradient(160deg,#3a2510 0%,#2e1c08 55%,#1a0f00 100%);
    color:var(--parchment);
    padding:18px 20px 16px;
    text-align:center;
    border-bottom:2px solid var(--gold);
    box-shadow:0 4px 20px rgba(0,0,0,.5);
    position:relative;z-index:500;
  }
  header .eyebrow{
    font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;
    color:var(--gold-bright);text-transform:uppercase;margin-bottom:6px;opacity:.9;
  }
  header h1{
    font-family:'Cinzel',serif;font-weight:700;
    font-size:clamp(16px,5vw,22px);line-height:1.25;
    color:var(--parchment);
  }
  header .ornament{
    color:var(--gold);font-size:14px;margin-top:8px;letter-spacing:6px;opacity:.7;
  }

  /* ── Geri butonu ── */
  .btn-back{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:42px;height:42px;border-radius:50%;
    background:rgba(184,134,11,.15);border:1px solid var(--gold);
    color:var(--gold-bright);font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s;z-index:501;
  }
  .btn-back:active{background:rgba(184,134,11,.35);}

  /* ── Harita ── */
  #map{flex:1 1 auto;width:100%;background:#d8cbb0;z-index:1;}
  .leaflet-popup-content-wrapper{
    background:var(--parchment);border:1px solid var(--gold);
    border-radius:6px;font-family:'Lora',serif;
  }
  .leaflet-popup-content{margin:12px 16px;color:var(--ink);}
  .leaflet-popup-content b{font-family:'Cinzel',serif;color:var(--bronze);}

  /* ── Alt bilgi paneli ── */
  .info-panel{
    flex:0 0 auto;
    background:linear-gradient(180deg,var(--parchment) 0%,var(--parchment-deep) 100%);
    padding:18px 22px calc(18px + env(safe-area-inset-bottom));
    border-top:2px solid var(--gold);
    box-shadow:0 -4px 20px rgba(0,0,0,.3);
  }
  .addr{
    display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;
  }
  .addr .pin{font-size:22px;flex:0 0 auto;line-height:1.3;}
  .addr .txt{font-size:14px;line-height:1.55;color:var(--ink-soft);}
  .addr .txt strong{
    display:block;font-family:'Cinzel',serif;font-size:15px;
    color:var(--ink);margin-bottom:3px;
  }
  .actions{display:flex;gap:10px;}
  .act-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 12px;border:none;border-radius:8px;
    font-family:'Cinzel',serif;font-weight:600;font-size:14px;
    cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s;
  }
  .act-btn:active{transform:scale(.97);}
  .act-primary{
    background:linear-gradient(135deg,var(--gold-bright),var(--bronze));
    color:#fff;box-shadow:0 3px 12px rgba(139,90,43,.4);
  }
  .act-secondary{
    background:transparent;color:var(--bronze);
    border:1.5px solid var(--bronze);
  }
</style>
</head>
<body>

<header>
  <button class="btn-back" onclick="goBack()" aria-label="Geri">‹</button>
  <div class="eyebrow">Sağlık Müzesi</div>
  <h1>Sultan II. Bayezid Külliyesi</h1>
  <div class="ornament">❧ ⸙ ❧</div>
</header>

<div id="map"></div>

<div class="info-panel">
  <div class="addr">
    <span class="pin">📍</span>
    <span class="txt">
      <strong>Adres</strong>
      Yeniimaret Mah., Sultan II. Bayezid Külliyesi<br>
      Merkez / Edirne, Türkiye
    </span>
  </div>
  <div class="actions">
    <a class="act-btn act-primary" id="directions" href="#" target="_blank" rel="noopener">
      🧭 Yol Tarifi
    </a>
    <a class="act-btn act-secondary" id="mapsLink" href="#" target="_blank" rel="noopener">
      🗺️ Haritada Aç
    </a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // Müze merkez koordinatı (Külliye sınır poligonu ortalaması)
  const MUSEUM = { lat: 41.685812, lng: 26.544020 };

  function goBack(){
    if (document.referrer && document.referrer.indexOf(location.host) !== -1) {
      history.back();
    } else {
      location.href = './rehber.html';
    }
  }

  // ── Harita ──
  const map = L.map('map', {
    center: [MUSEUM.lat, MUSEUM.lng],
    zoom: 17,
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // Altın renkli özel marker
  const goldIcon = L.divIcon({
    className: '',
    html: '<div style="font-size:34px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));">📍</div>',
    iconSize: [34, 34],
    iconAnchor: [17, 34],
    popupAnchor: [0, -32]
  });

  L.marker([MUSEUM.lat, MUSEUM.lng], { icon: goldIcon })
    .addTo(map)
    .bindPopup('<b>Sağlık Müzesi</b><br>Sultan II. Bayezid Külliyesi')
    .openPopup();

  // ── Yol tarifi & harita linkleri ──
  const ll = MUSEUM.lat + ',' + MUSEUM.lng;
  document.getElementById('directions').href =
    'https://www.google.com/maps/dir/?api=1&destination=' + ll;
  document.getElementById('mapsLink').href =
    'https://www.google.com/maps/search/?api=1&query=' + ll;
</script>

<script>
  // ── Service Worker Kaydı (offline + PWA shortcut desteği) ──
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => { reg.update(); console.log('[PWA] SW kayıtlı:', reg.scope); })
        .catch(err => console.warn('[PWA] SW hatası:', err));
    });
    let _reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (_reloaded) return; _reloaded = true; window.location.reload();
    });
  }
</script>
</body>
</html>
